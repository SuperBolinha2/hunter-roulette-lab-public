name: Tests and sharing audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Audit and regression tests
        shell: pwsh
        run: ./tools/Test-Project.ps1
